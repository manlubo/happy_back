plugins {
  id 'java'
  id 'org.springframework.boot' version '3.5.7'
  id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.gitbaby'
version = '0.0.1-SNAPSHOT'
description = 'happy_back'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
  configureEach {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter'
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
  developmentOnly 'org.springframework.boot:spring-boot-devtools'
  implementation 'org.springframework.boot:spring-boot-starter-mail:3.5.5'
  implementation 'org.springframework.boot:spring-boot-starter-validation'

  // 암호화 해시
  implementation 'commons-codec:commons-codec:1.19.0'

  // 버전 비교용 라이브러리
  implementation 'org.apache.maven:maven-artifact:3.9.9'

  // 유저 접속 정보 파싱 라이브러리
  implementation 'com.github.ua-parser:uap-java:1.6.1'

  // Logging
  implementation 'org.springframework.boot:spring-boot-starter-log4j2'

  // Lombok
  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'
  testCompileOnly 'org.projectlombok:lombok'
  testAnnotationProcessor 'org.projectlombok:lombok'

  // MapStruct
  implementation 'org.mapstruct:mapstruct:1.6.3'
  annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
  annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

  // DB
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  runtimeOnly 'org.postgresql:postgresql'
  implementation 'org.springframework.boot:spring-boot-starter-data-redis'
  implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

  // JWT
  implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
  runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
  runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

  // AWS SDK
  implementation platform("software.amazon.awssdk:bom:2.25.39")
  implementation "software.amazon.awssdk:s3"
  implementation "software.amazon.awssdk:sts"

  // swagger
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'

  // Test
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
  useJUnitPlatform()
  outputs.dir(layout.buildDirectory.dir("generated-snippets"))
}